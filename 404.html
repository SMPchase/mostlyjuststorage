<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex">
    <meta name="theme-color" content="#ff4f9a">
    <title>Not found — Mostly Just Storage</title>
    <link rel="stylesheet" href="/assets/site.css">
    <style>
      .not-found { min-height: 100svh; display: grid; place-items: center; padding: 2rem; background: #f53e8e; }
      .not-found-card { width: min(100%, 680px); padding: clamp(1.5rem, 6vw, 4rem); border: 2px solid #171515; background: #f4e74d; box-shadow: 8px 8px 0 #171515; }
      .not-found-code { margin: 0; font: 800 0.8rem/1 "Courier New", monospace; letter-spacing: 0.14em; text-transform: uppercase; }
      .not-found h1 { margin: 1rem 0; font: 500 clamp(3.2rem, 11vw, 7rem)/0.85 Georgia, serif; letter-spacing: -0.07em; }
      .not-found p { max-width: 480px; margin: 0 0 1.8rem; font-size: 1.1rem; }
    </style>
  </head>
  <body>
    <main class="not-found">
      <div class="not-found-card">
        <p class="not-found-code">404 / wrong closet</p>
        <h1>Nothing’s stored here.</h1>
        <p>The page moved, the link got weird, or this door was never meant to open.</p>
        <a class="button button-dark" href="/">Back to the studio</a>
      </div>
    </main>
  </body>
</html>
